*{
  box-sizing:border-box
}

html,body{
  margin:0;
  max-width:100%;
  overflow-x:clip;
  background:var(--bg);
  color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif
}

#root{
  width:100%;
  max-width:100%;
  box-sizing:border-box;
  overflow-x:clip
}

button,input,select,textarea{
  font:inherit
}

input,select,textarea,button{
  max-width:100%;
  min-width:0
}

/* Utilities tab: never widen the page, wrap long text inside its own cards. */

.tools-view{
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  overflow-x:clip
}

.tools-view>*{
  min-width:0;
  max-width:100%;
  box-sizing:border-box
}

.tools-view section{
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  overflow-x:clip
}

.tools-view section *{
  max-width:100%;
  box-sizing:border-box;
  min-width:0
}

.tools-view section p,.tools-view section div,.tools-view section span,.tools-view section b,.tools-view section h2,.tools-view section label{
  overflow-wrap:anywhere;
  word-break:break-word;
  white-space:normal
}

.tools-view section input,.tools-view section select,.tools-view section textarea{
  width:100%;
  white-space:normal
}

.tools-view section button{
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word
}

/* Modals: fit the viewport, scroll vertically, never permanently cover the nav. */

.modal-overlay{
  max-width:100vw;
  box-sizing:border-box;
  overflow-y:auto
}

.modal-sheet{
  max-width:calc(100vw - 24px);
  box-sizing:border-box
}

button{
  cursor:pointer
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--mint)!important;
  box-shadow:0 0 0 3px rgba(34,199,154,.16)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.hero-static{
  background:linear-gradient(135deg,#071d40 0%,#0d2f61 52%,#123f7e 100%);
  border:1px solid #d2b56e;
  box-shadow:0 14px 28px rgba(4,18,40,.18)
}

.gold-line{
  height:1px;
  background:linear-gradient(90deg,transparent,#d3b671,transparent)
}

.segment button{
  transition:.15s
}

.chip-active{
  background:#0a1f45!important;
  color:white!important;
  border-color:#0a1f45!important
}

@media (prefers-color-scheme: dark){
  .chip-active{
    background:#dcbb72!important;

  }

  input[type="date"]{
    color-scheme:dark
  }
}

/* ---- Motion: 250ms tab transitions, lift / press, stagger, bars ---- */

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.995)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes fadeIn{
  from{
    opacity:0
  }

  to{
    opacity:1
  }
}

@keyframes staggerIn{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes sheetUp{
  from{
    transform:translateY(28px);
    opacity:.6
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}

@keyframes detailFlip{
  from{
    opacity:0;
    transform:perspective(700px) rotateY(-7deg) translateX(10px)
  }

  to{
    opacity:1;
    transform:perspective(700px) rotateY(0) translateX(0)
  }
}

@keyframes popIn{
  from{
    opacity:0;
    transform:scale(.96)
  }

  to{
    opacity:1;
    transform:scale(1)
  }
}

.page-enter{
  animation:pageIn 250ms cubic-bezier(.22,.9,.3,1) both
}

.fade-in{
  animation:fadeIn 200ms ease both
}

.stagger-item{
  animation:staggerIn 300ms cubic-bezier(.22,.9,.3,1) both
}

.modal-sheet{
  animation:sheetUp 260ms cubic-bezier(.22,.9,.3,1) both
}

.modal-overlay{
  animation:fadeIn 200ms ease both
}

.detail-flip{
  animation:detailFlip 300ms cubic-bezier(.22,.9,.3,1) both
}

.pop-in{
  animation:popIn 220ms ease both
}

.lift{
  transition:transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease
}

@media (hover:hover){
  .lift:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 22px rgba(10,31,69,.13)
  }
}

.lift:active{
  transform:translateY(0) scale(.99)
}

button{
  transition:transform 120ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease
}

button:active{
  transform:scale(.96)
}

.press-none:active{
  transform:none
}

.bar-anim{
  transition:width 650ms cubic-bezier(.22,.9,.3,1)
}

.nav-indicator{
  transition:transform 250ms cubic-bezier(.3,.9,.3,1), left 250ms cubic-bezier(.3,.9,.3,1)
}

.bank-stage{
  perspective:900px
}

.bank-card{
  transition:transform 300ms cubic-bezier(.22,.9,.3,1), opacity 300ms ease, box-shadow 300ms ease;
  will-change:transform

<script>
(function(){
  var deferred=null, btn=null, dismissed=false;
  function isStandalone(){try{return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true}catch(e){return false}}
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  function remove(){if(btn&&btn.parentNode)btn.parentNode.removeChild(btn);btn=null}
  function build(){

    btn.setAttribute('style','position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:50;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 16px;border-radius:999px;background:linear-gradient(135deg,#0a1f45,#123a70);color:#fff;box-shadow:0 10px 26px rgba(10,31,69,.35);border:1px solid rgba(200,167,90,.55)');

    document.body.appendChild(btn);
    document.getElementById('mf-install-x').onclick=function(){dismissed=true;remove()};
    document.getElementById('mf-install-go').onclick=function(){
      if(deferred){var d=deferred;deferred=null;d.prompt();d.userChoice.then(function(c){if(!(c&&c.outcome==='accepted')){}}).catch(function(){});remove()}
      else if(isIOS){alert('Trên iPhone: bấm nút Chia sẻ (ô vuông có mũi tên) rồi chọn "Thêm vào MH chính".')}
    };
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;if(document.body)build();else document.addEventListener('DOMContentLoaded',build)});
  window.addEventListener('appinstalled',function(){deferred=null;dismissed=true;remove()});
  if(isIOS&&!isStandalone()){window.addEventListener('load',function(){setTimeout(build,2500)})}
})();
</script>
